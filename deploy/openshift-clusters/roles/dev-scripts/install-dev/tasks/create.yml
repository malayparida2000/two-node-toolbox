---
- import_tasks: check_vars.yml
- name: Trigger set project
  assert:
    that: true
    quiet: true
  changed_when: true
  notify:
    - Set OCP project

- name: Install Dev Scripts Requirements for OpenShift
  make:
    chdir: "{{dev_scripts_path}}"
    target: "requirements"

- name: Allow qemu read access for agent install
  ansible.posix.acl:
    path: "{{ item }}"
    entity: qemu
    etype: user
    permissions: rx
    state: present
  become: true
  when: method == "agent"
  loop:
    - "."
    - "/root"

- name: Start OpenShift
  make:
    chdir: "{{dev_scripts_path}}"
    target: "{{make_target[method]}}"
  async: "{{ install_dev_start_async }}"
  poll: "{{ install_dev_start_poll }}"
  when: not ansible_check_mode

- name: Check Start OpenShift
  make:
    chdir: "{{dev_scripts_path}}"
    target: "{{make_target[method]}}"
  when: ansible_check_mode
